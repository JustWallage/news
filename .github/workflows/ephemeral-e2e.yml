name: Ephemeral E2E

# Deploys a fully isolated copy of the app (worker + fresh D1) under a unique
# name, runs Playwright against it, and always tears everything down.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      WORKERS_DEV_SUBDOMAIN:
        required: true

jobs:
  ephemeral-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      E2E_NAME: news-e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral D1 database
        run: |
          pnpm exec wrangler d1 create "$E2E_NAME"
          DB_ID=$(pnpm exec wrangler d1 info "$E2E_NAME" --json | jq -r '.uuid')
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Template wrangler config for this run
        run: |
          sed -i "s/TEMPLATE_E2E_DB_ID/$DB_ID/" wrangler.jsonc
          sed -i "s/\"database_name\": \"news-e2e\"/\"database_name\": \"$E2E_NAME\"/" wrangler.jsonc
          # The ephemeral worker is internet-reachable, so don't ship the
          # committed webhook secret. Mint a per-run one, bake it into the config,
          # and hand the same value to the test step (see BASE_URL step below).
          WEBHOOK_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "E2E_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          sed -i "s/e2e-webhook-secret/$WEBHOOK_SECRET/" wrangler.jsonc

      - name: Apply migrations to the ephemeral D1
        run: pnpm exec wrangler d1 migrations apply DB --remote --env e2e

      - name: Build (e2e environment)
        run: CLOUDFLARE_ENV=e2e pnpm build

      - name: Deploy ephemeral worker
        run: pnpm exec wrangler deploy -c dist/news/wrangler.json --name "$E2E_NAME"

      - name: Set per-run TEST_AUTH_TOKEN
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "TEST_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$TOKEN" | pnpm exec wrangler secret put TEST_AUTH_TOKEN --name "$E2E_NAME"

      - name: Install Playwright browser
        run: pnpm playwright:install

      # A fresh workers.dev deployment AND the just-put TEST_AUTH_TOKEN secret
      # both propagate across edge colos asynchronously, and the two halves go
      # live INDEPENDENTLY: `/api/*` is `run_worker_first`, so the worker answers
      # there while the ASSETS handler still returns Cloudflare's "nothing here
      # yet" holding page — which is exactly what a browser loads first. Probing
      # only /api/me therefore passed on attempt 1 and left the suite racing
      # asset propagation for ~45s (Playwright asserting against the holding
      # page). So probe BOTH surfaces, and require several consecutive successes:
      # one 200 proves a single connection was served, not that the deployment
      # settled. Polled from the runner, i.e. the egress Playwright will use.
      - name: Wait for the ephemeral deployment to be ready
        env:
          BASE_URL: https://${{ env.E2E_NAME }}.${{ secrets.WORKERS_DEV_SUBDOMAIN }}
        run: |
          READY_STREAK=5
          streak=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -H "X-Test-User-Email: readiness@news.test" \
              -H "X-Test-Auth: $TEST_AUTH_TOKEN" \
              "$BASE_URL/api/me" || echo 000)
            doc=$(curl -s --max-time 10 -H 'Cache-Control: no-cache' "$BASE_URL/" || true)
            if [ "$code" = "200" ] && printf '%s' "$doc" | grep -q 'id="root"'; then
              streak=$((streak + 1))
              echo "Attempt ${i}: worker + assets ready (${streak}/${READY_STREAK})."
              if [ "$streak" -ge "$READY_STREAK" ]; then
                echo "Deployment ready and stable after attempt ${i}."
                exit 0
              fi
            else
              streak=0
              echo "Attempt ${i}: /api/me=${code}, SPA document not served yet; retrying in 2s…"
            fi
            sleep 2
          done
          echo "Deployment did not become ready in time." >&2
          exit 1

      - name: Run E2E suite against the ephemeral deployment
        env:
          BASE_URL: https://${{ env.E2E_NAME }}.${{ secrets.WORKERS_DEV_SUBDOMAIN }}
          # The per-run webhook secret minted above, so the telegram spec can
          # drive the bot webhook against this deployment.
          E2E_WEBHOOK_SECRET: ${{ env.E2E_WEBHOOK_SECRET }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      - name: Teardown ephemeral resources
        if: always()
        run: |
          pnpm exec wrangler delete --name "$E2E_NAME" --force || echo "worker delete failed (may not exist)"
          pnpm exec wrangler d1 delete "$E2E_NAME" --skip-confirmation || echo "d1 delete failed (may not exist)"
